<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <meta name="theme-color" content="#000000" />
    <title>Color Sort Visualizer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    
    <div class="main-container">
        <div class="copyright">&copy; B A S U D E V</div>
        <h1 class="gradient-title">Merge Sort With Color Visualization</h1>
        <style>
            .gradient-title {
            text-align: center;
            margin-top: 0;
            color: #fff;
            background: linear-gradient(135deg, #d8ffda, #2bc552);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            
            animation: gradientMove 8s ease-in-out infinite;
            }
            @keyframes gradientMove {
            0% { background-position: 0% 0%; }
            50% { background-position: 100% 100%; }
            100% { background-position: 0% 0%; }
            }
            .copyright {
            text-align: center;
            margin-top: 30px;
            color: #2bc5526c;
            font-size: 1rem;
            font-family: Arial, sans-serif;
            }
        </style>
        
        <div id="bar-container"></div>
         <div id="completionMessage">Merge Sort Complete!</div>
        
        <div class="controls">
            <button id="resetButton">Generate New Colors</button>
            <button id="sortButton">Sort</button>
        </div>
        
    </div>

    <script src="script.js"></script>
    
</body>
</html>
